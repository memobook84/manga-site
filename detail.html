</head>
<body>
    <!-- ヘッダー -->
    <header>
        <div class="header-container">
            <a href="home.html" class="header-logo"><img src="logo-atlas.png" alt="ATLAS COMIC" class="header-logo-img"></a>
            <h1><a href="home.html">ATLAS COMIC</a></h1>
            <nav class="header-nav">
                <a href="new-releases.html" class="nav-link">スケジュール</a>
                <a href="ranking.html" class="nav-link">ランキング</a>
                <a href="follow.html" class="nav-link follow-link">ブックマーク</a>
                <button class="nav-menu-btn" id="navMenuBtn"><svg viewBox="0 0 24 24" class="nav-caret" aria-hidden="true"><path d="M3 6C3 5.44772 3.44772 5 4 5H20C20.5523 5 21 5.44772 21 6C21 6.55228 20.5523 7 20 7H4C3.44772 7 3 6.55228 3 6Z"/><path d="M3 18C3 17.4477 3.44772 17 4 17H20C20.5523 17 21 17.4477 21 18C21 18.5523 20.5523 19 20 19H4C3.44772 19 3 18.5523 3 18Z"/><path d="M3 12C3 11.4477 3.44772 11 4 11H20C20.5523 11 21 11.4477 21 12C21 12.5523 20.5523 13 20 13H10.2625L7.61456 15.6479L4.96662 13H4C3.44772 13 3 12.5523 3 12Z"/></svg></button>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="ATLAS COMICを検索">
                <button class="search-icon" aria-label="検索">
                    <i class="ph-bold ph-magnifying-glass" style="font-size:20px"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 詳細ページコンテンツ -->
    <main class="detail-main">
        <div class="detail-container">
            <!-- 左側：表紙画像 -->
            <div class="detail-image">
                <div class="detail-cover-frame">
                    <img id="manga-image" src="" alt="漫画の表紙">
                    <button type="button" id="detail-image-badge" class="detail-image-badge" aria-label="動画を見る" hidden><i class="bi bi-collection-play-fill"></i></button>
                    <!-- 表紙の右下に丸ボタンで重ねる。
                         未登録＝枠のしおり、登録済＝塗りのしおり
                         （Octicons の bookmark-24 / bookmark-fill-24＝react-icons の GoBookmark / GoBookmarkFill と同じ字形） -->
                    <button id="follow-button" class="follow-button" aria-label="ブックマーク" title="ブックマーク">
                        <svg class="follow-mark follow-mark-outline" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 3.75C5 2.784 5.784 2 6.75 2h10.5c.966 0 1.75.784 1.75 1.75v17.5a.75.75 0 0 1-1.218.586L12 17.21l-5.781 4.625A.75.75 0 0 1 5 21.25Zm1.75-.25a.25.25 0 0 0-.25.25v15.94l5.031-4.026a.749.749 0 0 1 .938 0L17.5 19.69V3.75a.25.25 0 0 0-.25-.25Z"/>
                        </svg>
                        <svg class="follow-mark follow-mark-solid" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6.69 2h10.56c.966 0 1.75.784 1.75 1.75v17.5a.75.75 0 0 1-1.218.585L12 17.21l-5.781 4.626A.75.75 0 0 1 5 21.253L4.94 3.756A1.748 1.748 0 0 1 6.69 2Z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 右側：詳細情報 -->
            <div class="detail-info">
                <h1 id="manga-title" class="detail-title">読み込み中...</h1>
                <div class="detail-author-line"><span id="manga-author">-</span></div>

                <!-- メタ情報（表紙の横に表示・volumeページと同レイアウト） -->
                <h2 class="detail-meta-title">作品情報</h2>
                <div class="detail-meta">
                    <div class="meta-item">
                        <span class="meta-label">出版社</span>
                        <span class="meta-dots"></span>
                        <span id="manga-publisher" class="meta-value">-</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">レーベル</span>
                        <span class="meta-dots"></span>
                        <span id="manga-label" class="meta-value">-</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">ジャンル</span>
                        <span class="meta-dots"></span>
                        <span id="manga-genre" class="meta-value">-</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">最新刊</span>
                        <span class="meta-dots"></span>
                        <span id="manga-latest-date" class="meta-value">-</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">全巻数</span>
                        <span class="meta-dots"></span>
                        <span id="manga-date" class="meta-value">-</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">価格帯</span>
                        <span class="meta-dots"></span>
                        <span id="manga-price-range" class="meta-value">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ストーリー -->
        <div class="detail-description">
            <h2>ストーリー</h2>
            <p id="manga-description">読み込み中...</p>
        </div>

        <!-- 各巻セクション -->
        <div class="volumes-section">
            <div class="volumes-header">
                <h2 class="volumes-title">シリーズ一覧</h2>
                <div class="volumes-actions-wrap">
                    <!-- ボタンではなく実体のあるリンクにしている。
                         window.open だと iOS のPWA（ホーム画面から起動した状態）や
                         ポップアップブロックで無言で失敗するため。
                         href は detail.js が作品名から組み立てて入れる -->
                    <a id="cart-toggle-btn" class="cart-toggle-btn" target="_blank"
                       rel="noopener noreferrer" aria-label="Amazonで全巻を検索" hidden>
                        <i class="fa-brands fa-amazon"></i>
                    </a>
                    <div class="volumes-actions" id="volumes-actions" hidden>
                        <button type="button" id="cart-all-btn" class="cart-btn cart-btn-primary">
                            <i class="ph-bold ph-shopping-cart" style="font-size:14px"></i>
                            <span>全巻カートに入れる</span>
                        </button>
                        <button type="button" id="cart-range-btn" class="cart-btn cart-btn-ghost">
                            <i class="ph-bold ph-funnel" style="font-size:14px"></i>
                            <span>巻を指定</span>
                        </button>
                        <button type="button" class="cart-btn cart-btn-ghost" disabled>
                            <i class="ph-bold ph-bookmark-simple" style="font-size:14px"></i>
                            <span>未購入の巻をカートに入れる</span>
                        </button>
                    </div>
                </div>
            </div>
            <div id="volumes-grid" class="volumes-grid">
                <!-- JavaScriptで動的に生成 -->
            </div>
        </div>

        <!-- 巻指定モーダル -->
        <div id="range-modal" class="range-modal-overlay" role="dialog" aria-modal="true" aria-label="巻を指定">
            <div class="range-modal-content">
                <button type="button" class="range-modal-close" id="range-modal-close" aria-label="閉じる"><i class="ph-bold ph-x"></i></button>
                <h3 class="range-modal-title">巻を指定してカートに入れる</h3>
                <p class="range-modal-sub" id="range-modal-sub"></p>
                <div class="range-modal-row">
                    <label class="range-field">
                        <span>From</span>
                        <input type="number" id="range-from" min="1" value="1" inputmode="numeric">
                    </label>
                    <span class="range-sep">〜</span>
                    <label class="range-field">
                        <span>To</span>
                        <input type="number" id="range-to" min="1" value="1" inputmode="numeric">
                    </label>
                </div>
                <div class="range-keypad" id="range-keypad" aria-label="テンキー">
                    <button type="button" class="keypad-btn" data-key="1">1</button>
                    <button type="button" class="keypad-btn" data-key="2">2</button>
                    <button type="button" class="keypad-btn" data-key="3">3</button>
                    <button type="button" class="keypad-btn" data-key="4">4</button>
                    <button type="button" class="keypad-btn" data-key="5">5</button>
                    <button type="button" class="keypad-btn" data-key="6">6</button>
                    <button type="button" class="keypad-btn" data-key="7">7</button>
                    <button type="button" class="keypad-btn" data-key="8">8</button>
                    <button type="button" class="keypad-btn" data-key="9">9</button>
                    <button type="button" class="keypad-btn keypad-btn-util" data-key="clear">C</button>
                    <button type="button" class="keypad-btn" data-key="0">0</button>
                    <button type="button" class="keypad-btn keypad-btn-util" data-key="back" aria-label="一文字消す"><i class="ph-bold ph-backspace"></i></button>
                </div>
                <button type="button" id="range-submit" class="cart-btn cart-btn-primary range-submit">
                    <i class="ph-bold ph-shopping-cart" style="font-size:14px"></i>
                    <span>この範囲をカートに入れる</span>
                </button>
            </div>
        </div>
    </main>

    <!-- 動画モーダル -->
    <div id="video-modal" class="video-modal-overlay" role="dialog" aria-modal="true" aria-label="動画プレビュー">
        <div class="video-modal-content">
            <button type="button" class="video-modal-close" id="video-modal-close" aria-label="閉じる"><i class="ph-bold ph-x"></i></button>
            <iframe id="video-modal-iframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- サイトフッター -->
    <div class="site-footer">
        <a href="privacy.html">プライバシーポリシー</a>
        <span class="footer-sep">|</span>
        <a href="about.html">運営者情報</a>
        <span class="footer-sep">|</span>
        <a href="profile.html">管理人紹介</a>
    </div>

    <!-- ボトムナビ -->
    <nav class="bottom-nav">
        <a href="javascript:history.back()" class="bottom-nav-item" data-page="back">
            <i class="ph-light ph-arrow-left" style="font-size:22px"></i>
            <span>Back</span>
        </a>
        <a href="/home.html" class="bottom-nav-item" data-page="database">
            <i class="ph-light ph-house" style="font-size:22px"></i>
            <span>Home</span>
        </a>
        <a href="/ranking.html" class="bottom-nav-item" data-page="ranking">
            <svg class="lucide lucide-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>
            <span>Ranking</span>
        </a>
        <a href="/follow.html" class="bottom-nav-item" data-page="follow">
            <i class="ph-light ph-bookmark" style="font-size:22px"></i>
            <span>Bookmark</span>
        </a>
        <a href="/menu.html" class="bottom-nav-item" data-page="menu">
            <i class="ph-light ph-list" style="font-size:22px"></i>
            <span>Menu</span>
        </a>
    </nav>

    <script>
    (function() {
        var path = location.pathname;
        var items = document.querySelectorAll('.bottom-nav-item');
        items.forEach(function(item) {
            var page = item.dataset.page;
            if ((page === 'home' && (path === '/' || path === '/index.html')) ||
                (page === 'database' && path.includes('database')) ||
                (page === 'ranking' && path.includes('ranking')) ||
                (page === 'blog' && path.includes('blog')) ||
                (page === 'follow' && path.includes('follow'))) {
                item.classList.add('active');
            }
        });
    })();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
    <script src="nav-menu.js"></script>
</body>
