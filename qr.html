    <meta name="description" content="ATLAS COMIC のQRコード。スマホで読み取ってアクセスできます。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        body {
            background: radial-gradient(circle at 50% 38%, #241640 0%, #140e24 45%, #0a0712 100%);
            min-height: 100vh;
        }
        .qr-main {
            max-width: 600px;
            margin: 0 auto;
            padding: 160px 20px 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .qr-heading {
            font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.04em;
            color: #2B2B2B;
            margin: 0 0 8px;
        }
        .qr-sub {
            font-size: 14px;
            color: #888;
            margin: 0 0 32px;
            line-height: 1.7;
        }
        .qr-card {
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            box-shadow:
                0 0 0 1px rgba(155, 110, 230, 0.4),
                0 0 32px rgba(123, 79, 209, 0.55),
                0 0 80px rgba(123, 79, 209, 0.45),
                0 0 140px rgba(100, 68, 118, 0.35);
            animation: qrGlow 3.2s ease-in-out infinite;
        }
        @keyframes qrGlow {
            0%, 100% {
                box-shadow:
                    0 0 0 1px rgba(155, 110, 230, 0.4),
                    0 0 32px rgba(123, 79, 209, 0.55),
                    0 0 80px rgba(123, 79, 209, 0.45),
                    0 0 140px rgba(100, 68, 118, 0.35);
            }
            50% {
                box-shadow:
                    0 0 0 1px rgba(180, 140, 255, 0.6),
                    0 0 44px rgba(150, 100, 240, 0.75),
                    0 0 110px rgba(150, 100, 240, 0.6),
                    0 0 180px rgba(120, 80, 160, 0.45);
            }
        }
        .qr-card img {
            display: block;
            width: 260px;
            height: 260px;
            max-width: 66vw;
            max-height: 66vw;
            border-radius: 10px;
        }
        .qr-scan-label {
            margin-top: 34px;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: #b89de8;
            text-shadow: 0 0 18px rgba(150, 100, 240, 0.7);
        }
        .qr-url {
            margin-top: 28px;
            font-size: 14px;
            font-weight: 500;
            color: #4B2C82;
            word-break: break-all;
        }
        .qr-copy-btn {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border: none;
            border-radius: 999px;
            background: #4B2C82;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .qr-copy-btn:hover {
            background: #371F63;
        }
        .qr-copy-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="home.html" class="header-logo"><img src="logo-atlas.png" alt="ATLAS COMIC" class="header-logo-img"></a>
            <h1><a href="home.html">ATLAS COMIC</a></h1>
            <nav class="header-nav">

            </nav>
            <div class="search-box">
                <input type="text" placeholder="ATLAS COMICを検索">
                <button class="search-icon" aria-label="検索">
                    <i class="ph-bold ph-magnifying-glass" style="font-size:20px"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="qr-main">
        <div class="qr-card">
            <img src="qr-code.png" alt="ATLAS COMIC QRコード">
        </div>
        <div class="qr-scan-label">Scan to open</div>
    </main>

        <a href="/ranking.html" class="bottom-nav-item" data-page="ranking">
            <svg class="lucide lucide-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>
            <span>Ranking</span>

        <a href="/follow.html" class="bottom-nav-item" data-page="follow">
