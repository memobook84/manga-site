<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRコード - ATLAS COMIC</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0e0a18">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="description" content="ATLAS COMIC のQRコード。スマホで読み取ってアクセスできます。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script defer src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
    <style>
        body {
            background: radial-gradient(circle at 50% 38%, #241640 0%, #140e24 45%, #0a0712 100%);
            min-height: 100vh;
        }
        .qr-main {
            max-width: 600px;
            margin: 0 auto;
            padding: 160px 20px 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .qr-heading {
            font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.04em;
            color: #2B2B2B;
            margin: 0 0 8px;
        }
        .qr-sub {
            font-size: 14px;
            color: #888;
            margin: 0 0 32px;
            line-height: 1.7;
        }
        .qr-card {
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            box-shadow:
                0 0 0 1px rgba(155, 110, 230, 0.4),
                0 0 32px rgba(123, 79, 209, 0.55),
                0 0 80px rgba(123, 79, 209, 0.45),
                0 0 140px rgba(100, 68, 118, 0.35);
            animation: qrGlow 3.2s ease-in-out infinite;
        }
        @keyframes qrGlow {
            0%, 100% {
                box-shadow:
                    0 0 0 1px rgba(155, 110, 230, 0.4),
                    0 0 32px rgba(123, 79, 209, 0.55),
                    0 0 80px rgba(123, 79, 209, 0.45),
                    0 0 140px rgba(100, 68, 118, 0.35);
            }
            50% {
                box-shadow:
                    0 0 0 1px rgba(180, 140, 255, 0.6),
                    0 0 44px rgba(150, 100, 240, 0.75),
                    0 0 110px rgba(150, 100, 240, 0.6),
                    0 0 180px rgba(120, 80, 160, 0.45);
            }
        }
        .qr-card img {
            display: block;
            width: 260px;
            height: 260px;
            max-width: 66vw;
            max-height: 66vw;
            border-radius: 10px;
        }
        .qr-scan-label {
            margin-top: 34px;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: #b89de8;
            text-shadow: 0 0 18px rgba(150, 100, 240, 0.7);
        }
        .qr-url {
            margin-top: 28px;
            font-size: 14px;
            font-weight: 500;
            color: #4B2C82;
            word-break: break-all;
        }
        .qr-copy-btn {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 22px;
            border: none;
            border-radius: 999px;
            background: #4B2C82;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .qr-copy-btn:hover {
            background: #371F63;
        }
        .qr-copy-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="home.html" class="header-logo"><img src="logo-atlas.png" alt="ATLAS COMIC" class="header-logo-img"></a>
            <h1><a href="home.html">ATLAS COMIC</a></h1>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">ピックアップ</a>
                <a href="blog.html" class="nav-link">ブログ</a>
                <a href="follow.html" class="nav-link follow-link">ブックマーク</a>
                <button class="nav-menu-btn" id="navMenuBtn"><svg viewBox="0 0 448 512" class="nav-caret" aria-hidden="true"><path d="M384 480c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0zM224 352c-6.7 0-13-2.8-17.6-7.7l-104-112c-6.5-7-8.2-17.2-4.4-25.9s12.5-14.4 22-14.4l208 0c9.5 0 18.2 5.7 22 14.4s2.1 18.9-4.4 25.9l-104 112c-4.5 4.9-10.9 7.7-17.6 7.7z"/></svg></button>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="Search manga...">
                <button class="search-icon" aria-label="検索">
                    <i class="ph-bold ph-magnifying-glass" style="font-size:20px"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="qr-main">
        <div class="qr-card">
            <img src="qr-code.png" alt="ATLAS COMIC QRコード">
        </div>
        <div class="qr-scan-label">Scan to open</div>
    </main>

    <nav class="bottom-nav">
        <a href="javascript:history.back()" class="bottom-nav-item" data-page="back">
            <i class="ph-light ph-arrow-left" style="font-size:22px"></i>
            <span>Back</span>
        </a>
        <a href="/home.html" class="bottom-nav-item" data-page="database">
            <i class="ph-light ph-house" style="font-size:22px"></i>
            <span>Home</span>
        </a>
        <a href="/index.html" class="bottom-nav-item" data-page="home">
            <i class="ph-light ph-fire" style="font-size:22px"></i>
            <span>Pickup</span>
        </a>
        <a href="/follow.html" class="bottom-nav-item" data-page="follow">
            <i class="ph-light ph-bookmark" style="font-size:22px"></i>
            <span>Bookmark</span>
        </a>
        <a href="/menu.html" class="bottom-nav-item active" data-page="menu">
            <i class="ph-light ph-list" style="font-size:22px"></i>
            <span>Menu</span>
        </a>
    </nav>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
    <script src="swipe-back.js"></script>
    <script src="nav-menu.js"></script>
</body>
</html>
