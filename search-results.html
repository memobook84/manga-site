<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script>if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark-mode-pending');</script>
    <script>
    // キーワードなしで直接開かれた場合はホームへ戻す
    // （database.js が全カタログを読み込んでしまうため、その前に判定する）
    if (!new URLSearchParams(location.search).get('search')) location.replace('/home.html');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>検索結果 - ATLAS COMIC</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/favicon.png">
    <meta name="description" content="ATLAS COMICの漫画検索結果。">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://thumbnail.image.rakuten.co.jp">
    <link rel="preconnect" href="https://books.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Crimson+Pro:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Zilla+Slab:wght@400;600;700&family=Michroma&family=Anton&family=Big+Shoulders+Display:wght@900&family=Montserrat:wght@700;900&family=Barlow:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.17.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="legal.css">
    <script src="manga-data.js"></script>
    <script src="rakuten-adapter.js"></script>
    <script src="database.js"></script>
    <script defer src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
    <script src="page-hero-toggle.js"></script>
</head>
<body class="page-database">
    <!-- ヘッダー -->
    <header>
        <div class="header-container">
            <a href="home.html" class="header-logo"><img src="logo-atlas.png" alt="ATLAS COMIC" class="header-logo-img"></a>
            <h1><a href="home.html">ATLAS COMIC</a></h1>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">ピックアップ</a>
                <a href="blog.html" class="nav-link">ブログ</a>
                <a href="follow.html" class="nav-link follow-link">ブックマーク</a>
                <button class="nav-menu-btn" id="navMenuBtn"><svg viewBox="0 0 448 512" class="nav-caret" aria-hidden="true"><path d="M207.029 381.476L12.686 187.132c-9.373-9.373-9.373-24.569 0-33.941l22.667-22.667c9.357-9.357 24.522-9.375 33.901-.04L224 284.505l154.745-154.021c9.379-9.335 24.544-9.317 33.901.04l22.667 22.667c9.373 9.373 9.373 24.569 0 33.941L240.971 381.476c-9.373 9.372-24.569 9.372-33.942 0z"/></svg></button>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="Search manga...">
                <button class="search-icon" aria-label="検索">
                    <i class="ph-bold ph-magnifying-glass" style="font-size:20px"></i>
                </button>
            </div>
        </div>
    </header>

    <section class="page-hero">
        <h2>検索結果</h2>
        <p id="search-keyword-label"></p>
    </section>

    <!-- メインコンテンツ（サイドバーなし・全幅） -->
    <div class="main-layout">
        <main>
            <div class="manga-grid">
                <!-- database.js が動的に表示 -->
            </div>
            <!-- ページネーションは置かない。
                 database.js の renderPagination() は対象要素が無ければ
                 何もしないので、この要素を省くだけでよい -->

        </main>
    </div>

    <!-- サイトフッター -->
    <div class="site-footer">
        <a href="privacy.html">プライバシーポリシー</a>
        <span class="footer-sep">|</span>
        <a href="about.html">運営者情報</a>
        <span class="footer-sep">|</span>
        <a href="profile.html">管理人紹介</a>
    </div>

    <!-- ボトムナビ -->
    <nav class="bottom-nav">
        <a href="javascript:history.back()" class="bottom-nav-item" data-page="back">
            <i class="ph-light ph-arrow-left" style="font-size:22px"></i>
            <span>Back</span>
        </a>
        <a href="/home.html" class="bottom-nav-item" data-page="database">
            <i class="ph-light ph-house" style="font-size:22px"></i>
            <span>Home</span>
        </a>
        <a href="/index.html" class="bottom-nav-item" data-page="home">
            <i class="ph-light ph-fire" style="font-size:22px"></i>
            <span>Pickup</span>
        </a>
        <a href="/follow.html" class="bottom-nav-item" data-page="follow">
            <i class="ph-light ph-bookmark" style="font-size:22px"></i>
            <span>Bookmark</span>
        </a>
        <a href="/menu.html" class="bottom-nav-item" data-page="menu">
            <i class="ph-light ph-list" style="font-size:22px"></i>
            <span>Menu</span>
        </a>
    </nav>

    <script>
    // 見出しに検索キーワードを出す
    (function() {
        var q = new URLSearchParams(location.search).get('search') || '';
        var el = document.getElementById('search-keyword-label');
        if (el) el.textContent = '「' + q + '」の検索結果';
        document.title = q + ' の検索結果 - ATLAS COMIC';
    })();
    </script>

    <script>
    // 表示設定の反映（切替UIは profile.html にある）
    (function() {
        var body = document.body;
        if (localStorage.getItem('darkMode') === 'true') body.classList.add('dark-mode');
        if (localStorage.getItem('dbFlatCover') !== 'false') body.classList.add('flat-cover');
        if (localStorage.getItem('dbBgSoft') === 'true') body.classList.add('bg-soft');
    })();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
    <script src="swipe-back.js"></script>
    <script src="nav-menu.js"></script>
</body>
</html>
