<body>

    <!-- 巻詳細ページコンテンツ -->
    <main class="volume-main">
        <div class="volume-container">
            <!-- 左側：表紙画像 -->
            <div class="volume-image-wrap">
                <div class="volume-image">
                    <img id="volume-cover" src="" alt="巻の表紙">
                    <span id="swipe-arrow-prev" class="swipe-arrow swipe-arrow-left">
                        <i class="bi bi-caret-left-fill" style="font-size:16px"></i>
                    </span>
                    <span id="swipe-arrow-next" class="swipe-arrow swipe-arrow-right">
                        <i class="bi bi-caret-right-fill" style="font-size:16px"></i>
                    </span>
                </div>

                <!-- スマホ: 表紙の右に縦並び。底辺を表紙とそろえる（PCでは非表示） -->
                <div class="volume-actions-mobile">
                    <!-- この巻が公式に無料公開されている場合だけ volume.js が出す -->
                    <a class="icon-square-btn read-free-icon-btn js-read-free" href="#" hidden
                       aria-label="読む" title="読む">
                        <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M352 96c0-53.02-42.98-96-96-96s-96 42.98-96 96 42.98 96 96 96 96-42.98 96-96zM233.59 241.1c-59.33-36.32-155.43-46.3-203.79-49.05C13.55 191.13 0 203.51 0 219.14v222.8c0 14.33 11.59 26.28 26.49 27.05 43.66 2.29 131.99 10.68 193.04 41.43 9.37 4.72 20.48-1.71 20.48-11.87V252.56c-.01-4.67-2.32-8.95-6.42-11.46zm248.61-49.05c-48.35 2.74-144.46 12.73-203.78 49.05-4.1 2.51-6.41 6.96-6.41 11.63v245.79c0 10.19 11.14 16.63 20.54 11.9 61.04-30.72 149.32-39.11 192.97-41.4 14.9-.78 26.49-12.73 26.49-27.06V219.14c-.01-15.63-13.56-28.01-29.81-27.09z"/></svg>
                    </a>
                    <button type="button" class="icon-square-btn js-preview-btn" hidden
                            aria-label="試し読み" title="試し読み">
                        <i class="ph-bold ph-book-open" aria-hidden="true"></i>
                    </button>
                    <!-- 購入ボタン（アイコン版）は購入リンクをメタ欄のテキストリンクに
                         移したため休止中。戻す時はこのコメントを外すだけでよい
                    <a href="#" class="buy-icon-btn js-buy-amazon" target="_blank" rel="noopener"
                       aria-label="Amazonで購入" title="Amazonで購入">
                        <svg class="amazon-mark amazon-mark-a" viewBox="0 0 32 32" aria-hidden="true">
                            <text x="15.5" y="19.5" text-anchor="middle" fill="currentColor"
                                  font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">a</text>
                            <path d="M5.2 23.2c3.5 2.6 7.4 3.9 11.6 3.9 2.9 0 5.7-.6 8.4-1.9"
                                  fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
                            <path d="M23.4 26.6l4.4-2.4-.4 4.4z" fill="currentColor"/>
                        </svg>
                    </a>
                    <a href="#" class="buy-icon-btn js-buy-rakuten" target="_blank" rel="noopener"
                       aria-label="楽天ブックスで購入" title="楽天ブックスで購入">
                        <svg class="rakuten-mark rakuten-mark-r" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M23.277 21.3L3.939 24 .722 21.3h22.555zM7.6 19.276H3.939V0h6.052a6.653 6.653 0 0 1 6.65 6.646c0 2.234-1.108 4.204-2.799 5.418l5.418 7.211h-4.585l-4.486-5.979H7.6v5.98zm0-9.64h2.392a2.992 2.992 0 0 0 2.989-2.989 2.994 2.994 0 0 0-2.989-2.986H7.6v5.975z"/>
                        </svg>
                    </a>
                    -->
                </div>
            </div>

            <!-- 右側：詳細情報 -->
            <div class="volume-info-detail">
                <div class="volume-title-row">
                    <h1 id="volume-title" class="volume-title-main">読み込み中...</h1>
                    <span id="volume-number" class="volume-number-display">-</span>
                </div>

                <div class="volume-meta">
                    <div class="meta-item">
                        <span class="meta-label">著者</span>
                        <span id="volume-author" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">出版社</span>
                        <span id="volume-publisher" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">レーベル</span>
                        <span id="volume-label" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">ジャンル</span>
                        <span id="volume-genre" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">発売日</span>
                        <span id="volume-date" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">ISBN</span>
                        <span id="volume-isbn" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">価格</span>
                        <span id="volume-price" class="meta-value">-</span>
                    </div>

                    <!-- 購入先は他のメタ項目と同じ体裁のテキストリンク。
                         外部サイトへ出ることが分かるようにアイコンを添える -->
                    <div class="meta-item">
                        <span class="meta-label">購入</span>
                        <span class="meta-value buy-links">
                            <a href="#" class="buy-text-link buy-text-link--amazon js-buy-amazon" target="_blank" rel="noopener">
                                Amazon<i class="ph-bold ph-arrow-square-out" aria-hidden="true"></i>
                            </a>
                            <a href="#" class="buy-text-link buy-text-link--rakuten js-buy-rakuten" target="_blank" rel="noopener">
                                楽天ブックス<i class="ph-bold ph-arrow-square-out" aria-hidden="true"></i>
                            </a>
                        </span>
                    </div>
                </div>

                <!-- PC: 下端をそろえる行（左＝購入ボタン、右＝前後ナビ） -->
                <div class="volume-bottom-row">
                <div class="volume-actions-row volume-actions-pc">
                    <!-- この巻が公式に無料公開されている場合だけ volume.js が出す -->
                    <a class="read-free-btn js-read-free" href="#" hidden>
                        <svg viewBox="0 0 512 512" aria-hidden="true"><path d="M352 96c0-53.02-42.98-96-96-96s-96 42.98-96 96 42.98 96 96 96 96-42.98 96-96zM233.59 241.1c-59.33-36.32-155.43-46.3-203.79-49.05C13.55 191.13 0 203.51 0 219.14v222.8c0 14.33 11.59 26.28 26.49 27.05 43.66 2.29 131.99 10.68 193.04 41.43 9.37 4.72 20.48-1.71 20.48-11.87V252.56c-.01-4.67-2.32-8.95-6.42-11.46zm248.61-49.05c-48.35 2.74-144.46 12.73-203.78 49.05-4.1 2.51-6.41 6.96-6.41 11.63v245.79c0 10.19 11.14 16.63 20.54 11.9 61.04-30.72 149.32-39.11 192.97-41.4 14.9-.78 26.49-12.73 26.49-27.06V219.14c-.01-15.63-13.56-28.01-29.81-27.09z"/></svg>
                        <span>読む</span>
                    </a>
                    <button type="button" class="preview-button js-preview-btn" hidden>
                        <span>試し読み</span>
                        <i class="ph-bold ph-arrow-right" aria-hidden="true"></i>
                    </button>
                    <!-- 購入ボタン（アイコン版）は購入リンクをメタ欄のテキストリンクに
                         移したため休止中。戻す時はこのコメントを外すだけでよい
                    <a href="#" class="buy-icon-btn js-buy-amazon" target="_blank" rel="noopener"
                       aria-label="Amazonで購入" title="Amazonで購入">
                        <svg class="amazon-mark" viewBox="0 0 100 40" aria-hidden="true">
                            <text x="50" y="24" text-anchor="middle" fill="currentColor"
                                  font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">amazon</text>
                            <path d="M20 29C33 40 58 40 71.5 27.5" fill="none" stroke="currentColor"
                                  stroke-width="3.2" stroke-linecap="round"/>
                            <path d="M68.2 31.6L76 25.4L74.6 34.4Z" fill="currentColor"/>
                        </svg>
                    </a>
                    <a href="#" class="buy-icon-btn js-buy-rakuten" target="_blank" rel="noopener"
                       aria-label="楽天ブックスで購入" title="楽天ブックスで購入">
                        <svg class="rakuten-mark" viewBox="0 0 100 40" aria-hidden="true">
                            <text x="50" y="27" text-anchor="middle" fill="currentColor"
                                  font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Rakuten</text>
                        </svg>
                    </a>
                    -->
                </div>

                <!-- PC用前後ナビ -->
                <div class="pc-nav-arrows" style="display:none;">
                    <button id="pc-prev-volume" class="pc-nav-arrow" disabled title="前の巻">
                        <i class="bi bi-caret-left-fill"></i>
                    </button>
                    <button id="pc-next-volume" class="pc-nav-arrow" disabled title="次の巻">
                        <i class="bi bi-caret-right-fill"></i>
                    </button>
                </div>
                </div>

            </div>
        </div>

        <!-- ストーリー -->
        <div class="volume-description">
            <h2>ストーリー</h2>
            <p id="volume-synopsis">読み込み中...</p>
        </div>

        <!-- シリーズ一覧 -->
        <div id="series-list-section" class="series-list-section" style="display:none;">
            <h2 class="series-list-title">シリーズ一覧</h2>
            <div id="series-list-grid" class="series-list-grid"></div>
        </div>

        <div class="volume-bottom-section">

            <div class="navigation-buttons">
                <a href="#" id="back-to-series" class="nav-button">← 作品ページに戻る</a>

            </div>
        </div>
    </main>

    <!-- 試し読みビューア（Google Books Embedded Viewer） -->
    <div id="previewOverlay" class="preview-overlay" hidden>
        <div class="preview-modal">
            <div class="preview-modal-head">
                <span id="preview-modal-title" class="preview-modal-title">試し読み</span>
                <button type="button" id="preview-close" class="preview-close" aria-label="閉じる">
                    <i class="ph-bold ph-x" style="font-size:20px"></i>
                </button>
            </div>
            <div id="gbViewerCanvas" class="preview-viewer"></div>
        </div>
    </div>

    <div class="site-footer">

            <span>Home</span>
        </a>
        <a href="/ranking.html" class="bottom-nav-item" data-page="ranking">
            <svg class="lucide lucide-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>
            <span>Ranking</span>
        </a>
        <a href="/follow.html" class="bottom-nav-item" data-page="follow">
            <i class="ph-light ph-bookmark" style="font-size:22px"></i>
            <span>Bookmark</span>
        </a>
        <a href="/menu.html" class="bottom-nav-item" data-page="menu">
            <i class="ph-light ph-list" style="font-size:22px"></i>
            <span>Menu</span>
        </a>
    </nav>

    <script>
    (function() {
        var path = location.pathname;
        var items = document.querySelectorAll('.bottom-nav-item');
        items.forEach(function(item) {
            var page = item.dataset.page;
            if ((page === 'home' && (path === '/' || path === '/index.html')) ||
                (page === 'database' && path.includes('database')) ||
                (page === 'ranking' && path.includes('ranking')) ||
                (page === 'blog' && path.includes('blog')) ||
                (page === 'follow' && path.includes('follow'))) {
                item.classList.add('active');
            }
        });
    })();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
