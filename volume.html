<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <link rel="icon" type="image/png" href="favicon.png?v=5">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5">

    <meta property="og:site_name" content="ATLAS COMIC">
    <meta property="og:title" content="巻詳細 - ATLAS COMIC">
    <meta property="og:description" content="漫画の巻詳細情報 - ATLAS COMIC。あらすじ・価格・購入リンクをチェックできます。">

    <meta name="twitter:description" content="漫画の巻詳細情報 - ATLAS COMIC。あらすじ・価格・購入リンクをチェックできます。">
    <meta name="twitter:image" content="https://manga-site-three.vercel.app/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://thumbnail.image.rakuten.co.jp">
    <link rel="preconnect" href="https://books.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Crimson+Pro:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Michroma&family=Anton&family=Big+Shoulders+Display:wght@900&family=Montserrat:wght@700;900&family=Barlow:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.17.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="legal.css">
    <link rel="stylesheet" href="volume.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="manga-data.js"></script>
    <script src="rakuten-adapter.js"></script>
    <script src="volume.js"></script>
<script defer src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
</head>
<body>
    <!-- ヘッダー -->
    <header>
        <div class="header-container">
            <a href="home.html" class="header-logo"><img src="logo-atlas.png" alt="ATLAS COMIC" class="header-logo-img"></a>
            <h1><a href="home.html">ATLAS COMIC</a></h1>
            <nav class="header-nav">
                <a href="new-releases.html" class="nav-link">新刊</a>
                <a href="ranking.html" class="nav-link">ランキング</a>
                <a href="follow.html" class="nav-link follow-link">ブックマーク</a>
                <button class="nav-menu-btn" id="navMenuBtn"><svg viewBox="0 0 24 24" class="nav-caret" aria-hidden="true"><path d="M3 6C3 5.44772 3.44772 5 4 5H20C20.5523 5 21 5.44772 21 6C21 6.55228 20.5523 7 20 7H4C3.44772 7 3 6.55228 3 6Z"/><path d="M3 18C3 17.4477 3.44772 17 4 17H20C20.5523 17 21 17.4477 21 18C21 18.5523 20.5523 19 20 19H4C3.44772 19 3 18.5523 3 18Z"/><path d="M3 12C3 11.4477 3.44772 11 4 11H20C20.5523 11 21 11.4477 21 12C21 12.5523 20.5523 13 20 13H10.2625L7.61456 15.6479L4.96662 13H4C3.44772 13 3 12.5523 3 12Z"/></svg></button>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="ATLAS COMICを検索">
                <button class="search-icon" aria-label="検索">
                    <i class="ph-bold ph-magnifying-glass" style="font-size:20px"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 巻詳細ページコンテンツ -->
    <main class="volume-main">
        <div class="volume-container">
            <!-- 左側：表紙画像 -->
            <div class="volume-image-wrap">
                <div class="volume-image">
                    <img id="volume-cover" src="" alt="巻の表紙">
                    <span id="swipe-arrow-prev" class="swipe-arrow swipe-arrow-left">
                        <i class="bi bi-caret-left-fill" style="font-size:16px"></i>
                    </span>
                    <span id="swipe-arrow-next" class="swipe-arrow swipe-arrow-right">
                        <i class="bi bi-caret-right-fill" style="font-size:16px"></i>
                    </span>
                </div>
                <a href="#" id="buy-amazon" class="buy-button amazon-button" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    Amazonで購入
                </a>
                <button type="button" id="preview-btn" class="buy-button preview-button" hidden>
                    <i class="ph-bold ph-book-open" style="font-size:16px"></i>
                    試し読み
                </button>
            </div>

            <!-- 右側：詳細情報 -->
            <div class="volume-info-detail">
                <div class="volume-title-row">
                    <h1 id="volume-title" class="volume-title-main">読み込み中...</h1>
                    <span id="volume-number" class="volume-number-display">-</span>
                </div>

                <div class="volume-meta">
                    <div class="meta-item">
                        <span class="meta-label">著者</span>
                        <a href="#" id="volume-author" class="meta-value author-link">-</a>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">出版社</span>
                        <span id="volume-publisher" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">レーベル</span>
                        <span id="volume-label" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">ジャンル</span>
                        <span id="volume-genre" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">発売日</span>
                        <span id="volume-date" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">ISBN</span>
                        <span id="volume-isbn" class="meta-value">-</span>
                    </div>

                    <div class="meta-item">
                        <span class="meta-label">価格</span>
                        <span id="volume-price" class="meta-value">-</span>
                    </div>
                </div>

                <!-- PC用前後ナビ -->
                <div class="pc-nav-arrows" style="display:none;">
                    <button id="pc-prev-volume" class="pc-nav-arrow" disabled title="前の巻">
                        <i class="bi bi-caret-left-fill"></i>
                    </button>
                    <button id="pc-next-volume" class="pc-nav-arrow" disabled title="次の巻">
                        <i class="bi bi-caret-right-fill"></i>
                    </button>
                </div>

            </div>
        </div>

        <!-- ストーリー -->
        <div class="volume-description">
            <h2>ストーリー</h2>
            <p id="volume-synopsis">読み込み中...</p>
        </div>

        <!-- シリーズ一覧 -->
        <div id="series-list-section" class="series-list-section" style="display:none;">
            <h2 class="series-list-title">シリーズ一覧</h2>
            <div id="series-list-grid" class="series-list-grid"></div>
        </div>

        <div class="volume-bottom-section">

            <div class="navigation-buttons">
                <a href="#" id="back-to-series" class="nav-button">← 作品ページに戻る</a>

            </div>
        </div>
    </main>

    <!-- 試し読みビューア（Google Books Embedded Viewer） -->
    <div id="previewOverlay" class="preview-overlay" hidden>
        <div class="preview-modal">
            <div class="preview-modal-head">
                <span id="preview-modal-title" class="preview-modal-title">試し読み</span>
                <button type="button" id="preview-close" class="preview-close" aria-label="閉じる">
                    <i class="ph-bold ph-x" style="font-size:20px"></i>
                </button>
            </div>
            <div id="gbViewerCanvas" class="preview-viewer"></div>
        </div>
    </div>

    <!-- サイトフッター -->
    <div class="site-footer">
        <a href="privacy.html">プライバシーポリシー</a>
        <span class="footer-sep">|</span>
        <a href="about.html">運営者情報</a>
        <span class="footer-sep">|</span>
        <a href="profile.html">管理人紹介</a>
    </div>

    <!-- ボトムナビ -->
    <nav class="bottom-nav">
        <a href="javascript:history.back()" class="bottom-nav-item" data-page="back">
            <i class="ph-light ph-arrow-left" style="font-size:22px"></i>
            <span>Back</span>
        </a>
        <a href="/home.html" class="bottom-nav-item" data-page="database">
            <i class="ph-light ph-house" style="font-size:22px"></i>
            <span>Home</span>
        </a>
        <a href="/ranking.html" class="bottom-nav-item" data-page="ranking">
            <svg class="lucide lucide-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z"/><path d="M5 21h14"/></svg>
            <span>Ranking</span>
        </a>
        <a href="/follow.html" class="bottom-nav-item" data-page="follow">
            <i class="ph-light ph-bookmark" style="font-size:22px"></i>
            <span>Bookmark</span>
        </a>
        <a href="/menu.html" class="bottom-nav-item" data-page="menu">
            <i class="ph-light ph-list" style="font-size:22px"></i>
            <span>Menu</span>
        </a>
    </nav>

    <script>
    (function() {
        var path = location.pathname;
        var items = document.querySelectorAll('.bottom-nav-item');
        items.forEach(function(item) {
            var page = item.dataset.page;
            if ((page === 'home' && (path === '/' || path === '/index.html')) ||
                (page === 'database' && path.includes('database')) ||
                (page === 'ranking' && path.includes('ranking')) ||
                (page === 'blog' && path.includes('blog')) ||
                (page === 'follow' && path.includes('follow'))) {
                item.classList.add('active');
            }
        });
    })();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
    <script src="nav-menu.js"></script>
</body>
</html>
