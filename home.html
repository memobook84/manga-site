                        <li><button type="button" class="sidebar-link" data-filter="label" data-value="ちゃおコミックス">ちゃお</button></li>

            <!-- サイドバーを畳むボタンが2つ。どちらもサイドバーは細い帯になるが、

                 位置で覚えてもらう。畳むと押したほうだけが残って矢印が反転する -->

        <!-- メインエリア -->
        <main>
            <!-- 新着作品＝1巻が最近出たシリーズ。data/new-series.json を
                 database.js が読んで埋める。中身が入るまでは hidden のまま。
                 1ページ目・フィルタなしの時だけ出す（それ以外は database.js が隠す） -->
            <section class="new-series" id="new-series" hidden>
                <div class="new-series-header">
                    <!-- 見出しは文字。以前は Material Icons の fiber_new
                         （react-icons の MdFiberNew）アイコン1つだけにしていた。
                         戻したくなった時のために、そのSVGを下にコメントで残す -->
                    <h2 class="new-series-title">新着作品</h2>
                    <!-- アイコン版の見出し（休止中）
                    <h2 class="new-series-title" aria-label="新着作品">
                        <svg class="new-series-title-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20,4H4C2.89,4,2.01,4.89,2.01,6L2,18c0,1.11,0.89,2,2,2h16c1.11,0,2-0.89,2-2V6C22,4.89,21.11,4,20,4z M8.5,15H7.3l-2.55-3.5V15H3.5V9h1.25l2.5,3.5V9H8.5V15z M13.5,10.26H11v1.12h2.5v1.26H11v1.11h2.5V15h-4V9h4V10.26z M20.5,14c0,0.55-0.45,1-1,1h-4c-0.55,0-1-0.45-1-1V9h1.25v4.51h1.13V9.99h1.25v3.51h1.12V9h1.25V14z"/>
                        </svg>
                    </h2>
                    -->

                <!-- 段ごとの横スクロール枠（.new-series-viewport）を database.js が作る。
                     送りボタンは各段の左右の端に重ねる。スクロールバーは出さず、

                <div class="new-series-rows" id="new-series-rows"></div>
            </section>
            <!-- 話題の作品＝新着作品の2段より下、カタログのグリッド全体の見出し。
                 中身は今までどおり（並びも件数も変えていない）。
                 出す条件は新着欄と同じ「1ページ目・フィルタなし・検索なし」で、
                 database.js の updateNewSeries() が新着欄と一緒に出し入れする -->
            <div class="grid-header" id="grid-header" hidden>

            </div>

            </div>

    <script>
    (function() {
        var path = location.pathname;
        var items = document.querySelectorAll('.bottom-nav-item');
        items.forEach(function(item) {
            var page = item.dataset.page;
            if ((page === 'database' && (path === '/' || path.includes('home') || path.includes('database'))) ||
                (page === 'ranking' && path.includes('ranking')) ||
                (page === 'blog' && path.includes('blog')) ||
                (page === 'follow' && path.includes('follow'))) {
                item.classList.add('active');
            }
        });
    })();
    </script>

    <script>
    // 表示設定の反映（切替UIは profile.html にある）
    // ダークモード / 表紙の質感 / 背景色 / 作品タイトル の4つを localStorage から適用する
    (function() {
        var body = document.body;
        if (localStorage.getItem('darkMode') === 'true') body.classList.add('dark-mode');
        // 表紙: 未設定ならオン（軽い影）。明示的にオフにした場合だけ切る
        if (localStorage.getItem('dbFlatCover') !== 'false') body.classList.add('flat-cover');
        if (localStorage.getItem('dbBgSoft') === 'true') body.classList.add('bg-soft');
        // 作品タイトル: 未設定なら従来どおり表示。オンのときだけ隠す。
        // グリッドは database.js が非同期で描くので、ここで付けておけば
        // 「一度出てから消える」チラつきは起きない
        if (localStorage.getItem('dbHideTitles') === 'true') body.classList.add('hide-titles');
    })();
    </script>

    <script>
    // サイドバー開閉（ボタンはサイドバーの最下段に2つ）
    // モードは3つ。どちらのボタンもトグルで、押すと「開いた状態」に戻る。
    //   ''          … サイドバーあり（既定）
    //   'collapsed' … 畳むだけ。カタログの幅は畳む前のままで中央寄せ
    //   'wide'      … ワイド。カタログが空いたぶんまで広がって表紙も大きくなる
    (function() {
        var layout = document.querySelector('.main-layout');
        var btn = document.getElementById('sidebar-toggle');
        var wideBtn = document.getElementById('sidebar-wide');
        if (!btn || !wideBtn || !layout) return;
        // 読み込み時は常に開いた状態。折りたたみは保存せずその場限りにする
        localStorage.removeItem('dbSidebarCollapsed');

        var mode = '';

        function apply() {
            layout.classList.toggle('sidebar-collapsed', mode === 'collapsed');
            layout.classList.toggle('sidebar-wide', mode === 'wide');
            document.body.classList.toggle('sidebar-collapsed', mode === 'collapsed');
            document.body.classList.toggle('sidebar-wide', mode === 'wide');

            btn.setAttribute('aria-expanded', String(mode !== 'collapsed'));
            btn.setAttribute('aria-label', mode === 'collapsed' ? 'サイドバーを戻す' : 'サイドバーを畳む');
            wideBtn.setAttribute('aria-expanded', String(mode !== 'wide'));
            wideBtn.setAttribute('aria-label', mode === 'wide' ? 'ワイド表示をやめる' : 'ワイド表示にする');
            // 矢印の反転はCSS側（.main-layout.sidebar-wide #sidebar-wide i など）
        }

        btn.addEventListener('click', function() {
            mode = (mode === 'collapsed') ? '' : 'collapsed';
            apply();
        });
        wideBtn.addEventListener('click', function() {
            mode = (mode === 'wide') ? '' : 'wide';
            apply();
        });
    })();
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');

    </script>
