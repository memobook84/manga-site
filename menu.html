    <style>
        body {
            /* 背景は style.css の共通指定（--color-bg / bg-soft トグル）に従う */
            min-height: 100vh;
        }
        .menu-main {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 0 100px;
        }
        .menu-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 28px 20px 14px;
            border-bottom: none;
        }
        /* カードグリッド（3列・単行本の表紙風） */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px 14px;
            padding: 0 20px;
        }
        /* ピックアップ／ブログを区切る横ライン */
        .menu-divider {
            border: 0;
            border-top: 1px solid var(--color-border, #E5E1DC);
            margin: 26px 20px 24px;
        }
        .menu-card {
            position: relative;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1.45;
            text-decoration: none;
            background: var(--bg, #ffffff);
            /* 左は背表紙側＝角を立て、右＝小口側だけ丸める */
            border-radius: 2px 7px 7px 2px;
            overflow: hidden;
            /* 紙色のカードが白背景に埋もれないよう、影＋ヘアラインで縁取る */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.13),
                        inset 0 0 0 1px rgba(0, 0, 0, 0.06);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        /* 背表紙の折り目（左端の綴じ） */
        .menu-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: linear-gradient(90deg,
                rgba(0, 0, 0, 0.08) 0%,
                rgba(0, 0, 0, 0.02) 60%,
                rgba(0, 0, 0, 0.00) 100%);
            z-index: 2;
        }
        .menu-card:active {
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        /* 装丁の中身（.npc-title / .npc-art / .npc-author と各巻の
           カバー配色・図案は style.css の共通定義を使用） */
    </style>
</head>
