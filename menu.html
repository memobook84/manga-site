<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#644476">
    <link rel="apple-touch-icon" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://thumbnail.image.rakuten.co.jp">
    <link rel="preconnect" href="https://books.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.17.0/dist/tabler-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script defer src="https://unpkg.com/@phosphor-icons/web@2.1.2"></script>
    <style>
        body {
            background: #ffffff;
            min-height: 100vh;
        }
        .menu-main {
            max-width: 600px;
            margin: 0 auto;
            padding: 24px 0 100px;
        }
        .menu-section-title {
            font-size: 11px;
            font-weight: 600;
            color: #aaa;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            padding: 28px 20px 14px;
            border-bottom: none;
        }
        /* カードグリッド（3列・単行本の表紙風） */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px 14px;
            padding: 0 20px;
        }
        .menu-card {
            position: relative;
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1.45;
            text-decoration: none;
            background: var(--bg, #ffffff);
            /* 左は背表紙側＝角を立て、右＝小口側だけ丸める */
            border-radius: 2px 7px 7px 2px;
            overflow: hidden;
            /* 紙色のカードが白背景に埋もれないよう、影＋ヘアラインで縁取る */
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.13),
                        inset 0 0 0 1px rgba(0, 0, 0, 0.06);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        /* 背表紙の折り目（左端の綴じ） */
        .menu-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: linear-gradient(90deg,
                rgba(0, 0, 0, 0.08) 0%,
                rgba(0, 0, 0, 0.02) 60%,
                rgba(0, 0, 0, 0.00) 100%);
            z-index: 2;
        }
        .menu-card:active {
            transform: scale(0.96);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        }
        /* 装丁の中身（.npc-title / .npc-art / .npc-author と各巻の
           カバー配色・図案は style.css の共通定義を使用） */
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="home.html" class="header-logo"><img src="logo-atlas.png" alt="ATLAS COMIC" class="header-logo-img"></a>
            <h1><a href="home.html">ATLAS COMIC</a></h1>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">ピックアップ</a>
                <a href="blog.html" class="nav-link">ブログ</a>
                <a href="follow.html" class="nav-link follow-link">ブックマーク</a>
                <button class="nav-menu-btn" id="navMenuBtn"><svg viewBox="0 0 448 512" class="nav-caret" aria-hidden="true"><path d="M384 480c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l320 0zM224 352c-6.7 0-13-2.8-17.6-7.7l-104-112c-6.5-7-8.2-17.2-4.4-25.9s12.5-14.4 22-14.4l208 0c9.5 0 18.2 5.7 22 14.4s2.1 18.9-4.4 25.9l-104 112c-4.5 4.9-10.9 7.7-17.6 7.7z"/></svg></button>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="Search manga...">
                <button class="search-icon" aria-label="検索">
                    <i class="ph-bold ph-magnifying-glass" style="font-size:20px"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="menu-main">
        <div class="menu-section-title">Browse</div>
        <div class="menu-grid">
            <a href="index.html" class="menu-card npc-pickup">
                <span class="npc-title">ピックアップ</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
            <a href="home.html" class="menu-card npc-database">
                <span class="npc-title">データベース</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
            <a href="ranking.html" class="menu-card npc-ranking">
                <span class="npc-title">ランキング</span>
                <span class="npc-art"></span>

            </a>
            <a href="new-releases.html" class="menu-card npc-new">
                <span class="npc-title">新刊</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
            <a href="blog.html" class="menu-card npc-blog">
                <span class="npc-title">ブログ</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
            <a href="follow.html" class="menu-card npc-fav">
                <span class="npc-title">お気に入り</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
        </div>

        <div class="menu-section-title">Info</div>
        <div class="menu-grid">
            <a href="qr.html" class="menu-card npc-qr">
                <span class="npc-title">QRコード</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
            <a href="profile.html" class="menu-card npc-profile">
                <span class="npc-title">管理人紹介</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
            <a href="about.html" class="menu-card npc-about">
                <span class="npc-title">運営者情報</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
            <a href="privacy.html" class="menu-card npc-privacy">
                <span class="npc-title">プライバシー</span>
                <span class="npc-art"></span>
                <span class="npc-author">Atlas Comic</span>
            </a>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="javascript:history.back()" class="bottom-nav-item" data-page="back">
            <i class="ph-light ph-arrow-left" style="font-size:22px"></i>
            <span>Back</span>
        </a>
        <a href="/home.html" class="bottom-nav-item" data-page="database">

    </nav>

    <script>

        navigator.serviceWorker.register('/sw.js');

</body>
